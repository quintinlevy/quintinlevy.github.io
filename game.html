<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Replace the game title -->
  <title>Currupted Space — Quintin Levy</title>
  <meta name="description" content="A PICO-8 game by Quintin Levy.">
  <style>
    * { box-sizing: border-box; }
    body {
      max-width: 700px; margin: 0 auto; padding: 16px;
      background: #000; color: #fff; line-height: 1.5;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    a { color: #fff; }
    .button { display: inline-block; border: 1px solid #fff; padding: 4px 12px; text-decoration: none; }
    .game { border: 1px solid #fff; width: 100%; aspect-ratio: 1; }
    .panel { border: 1px solid #fff; background: #000; padding: 12px 16px; margin-top: 16px; }
    .panel h2 { font-size: 1rem; margin: 0 0 8px; }
    .panel p { margin: 0; }

    /* Background stars: two layers of tiny dots drifting left at different speeds */
    body::before, body::after {
      content: ""; position: fixed; inset: 0; z-index: -1; opacity: 0.6;
      animation: drift 120s linear infinite;
    }
    body::before {
      background-image:
        radial-gradient(1px 1px at 25px 40px, #fff, transparent),
        radial-gradient(1px 1px at 140px 110px, #fff, transparent),
        radial-gradient(1px 1px at 90px 180px, #fff, transparent),
        radial-gradient(1px 1px at 190px 20px, #fff, transparent);
      background-size: 200px 200px;
    }
    body::after {
      background-image:
        radial-gradient(1.5px 1.5px at 60px 90px, #fff, transparent),
        radial-gradient(1.5px 1.5px at 250px 230px, #fff, transparent);
      background-size: 300px 300px;
      animation-duration: 70s;
    }
    @keyframes drift { to { background-position: -600px 0; } }
    /* Keep stars still for visitors who turn off motion in their system settings */
    @media (prefers-reduced-motion: reduce) { body::before, body::after { animation: none; } }
  </style>
</head>
<body>

  <header>
    <a class="button" href="index.html">← Home</a>
  </header>

  <main>
    <h1>Currupted Space</h1>

    <!-- The game's .html and .js files live in the currupted_space_game folder -->
    <iframe class="game" src="currupted_space_game/currupted_space.html" title="Currupted Space"></iframe>

    <section class="panel">
      <h2>About this game</h2>
      <p>Made in one week for a school game jam. The theme was "Gravity Is Broken".</p>
    </section>
  </main>

</body>
</html>
